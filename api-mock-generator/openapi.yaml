{
  "openapi": "3.1.0",
  "info": {
    "title": "FastAPI",
    "version": "0.1.0"
  },
  "paths": {
    "/generate-mocks": {
      "post": {
        "summary": "Generate Mock Scripts Endpoint",
        "operationId": "generate_mock_scripts_endpoint_generate_mocks_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/GenerateMocksRequest"
              },
              "example": {
                "swagger": "{ \"openapi\": \"3.0.0\", \"info\": { \"title\": \"Petstore\", \"version\": \"1.0.0\" }, \"paths\": { \"/pets\": { \"get\": { \"summary\": \"List all pets\", \"responses\": { \"200\": { \"description\": \"A list of pets.\" } } } } } }",
                "config": {
                  "instructions": "Generate mocks for listing all pets",
                  "usePreviousScripts": false
                }
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/modify-method": {
      "post": {
        "summary": "Modify Method Endpoint",
        "operationId": "modify_method_endpoint_modify_method_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ModifyMethodRequest"
              },
              "example": {
                "swagger": "{ \"openapi\": \"3.0.0\", \"info\": { \"title\": \"Petstore\", \"version\": \"1.0.0\" }, \"paths\": { \"/pets\": { \"get\": { \"summary\": \"List all pets\", \"responses\": { \"200\": { \"description\": \"A list of pets.\" } } } } } }",
                "config": {
                  "instructions": "change the name Doggo to Sky",
                  "script": "mc.setProperty('CONTENT_TYPE', 'application/json'); var response = [{ id: 1, name: 'Doggo' }]; mc.setPayloadJSON(response); mc.setProperty('HTTP_SC', '200');",
                  "modify": {
                    "path": "/pets",
                    "method": "get",
                    "isDefaultScript": false
                  }
                }
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "ConfigModify": {
        "properties": {
          "path": {
            "type": "string",
            "title": "Path",
            "example": "/pets"
          },
          "method": {
            "type": "string",
            "title": "Method",
            "example": "get"
          },
          "isDefaultScript": {
            "type": "boolean",
            "title": "IsDefaultscript",
            "default": false,
            "example": false
          }
        },
        "type": "object",
        "required": ["path", "method"],
        "title": "ConfigModify"
      },
      "GenerateMockConfig": {
        "properties": {
          "instructions": {
            "anyOf": [
              { "type": "string" },
              { "type": "null" }
            ],
            "title": "Instructions",
            "example": "Generate mocks for listing all pets"
          },
          "usePreviousScripts": {
            "type": "boolean",
            "title": "Usepreviousscripts",
            "default": false,
            "example": false
          }
        },
        "type": "object",
        "title": "GenerateMockConfig"
      },
      "GenerateMocksRequest": {
        "properties": {
          "swagger": {
            "type": "string",
            "title": "Swagger",
            "example": "{ \"openapi\": \"3.0.0\", \"info\": { \"title\": \"Petstore\", \"version\": \"1.0.0\" }, \"paths\": { \"/pets\": { \"get\": { \"summary\": \"List all pets\" } } } }"
          },
          "config": {
            "anyOf": [
              { "$ref": "#/components/schemas/GenerateMockConfig" },
              { "type": "null" }
            ]
          }
        },
        "type": "object",
        "required": ["swagger"],
        "title": "GenerateMocksRequest"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ModifyConfig": {
        "properties": {
          "instructions": {
            "type": "string",
            "title": "Instructions",
            "default": "Generate mock scripts for the specified endpoint",
            "example": "change the name Doggo to Sky"
          },
          "script": {
            "type": "string",
            "title": "Script",
            "default": "No Script",
            "example": "mc.setProperty('CONTENT_TYPE', 'application/json'); var response = [{ id: 1, name: 'Doggo' }]; mc.setPayloadJSON(response); mc.setProperty('HTTP_SC', '200');"

          },
          "modify": {
            "$ref": "#/components/schemas/ConfigModify"
          }
        },
        "type": "object",
        "required": ["modify"],
        "title": "ModifyConfig"
      },
      "ModifyMethodRequest": {
        "properties": {
          "swagger": {
            "type": "string",
            "title": "Swagger",
            "example": "{ \"openapi\": \"3.0.0\", \"info\": { \"title\": \"Petstore\", \"version\": \"1.0.0\" }, \"paths\": { \"/pets\": { \"get\": { \"summary\": \"List all pets\" } } } }"
          },
          "config": {
            "$ref": "#/components/schemas/ModifyConfig"
          }
        },
        "type": "object",
        "required": ["swagger", "config"],
        "title": "ModifyMethodRequest"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                { "type": "string" },
                { "type": "integer" }
              ]
            },
            "type": "array",
            "title": "Location",
            "example": ["body", "swagger"]
          },
          "msg": {
            "type": "string",
            "title": "Message",
            "example": "field required"
          },
          "type": {
            "type": "string",
            "title": "Error Type",
            "example": "value_error.missing"
          }
        },
        "type": "object",
        "required": ["loc", "msg", "type"],
        "title": "ValidationError"
      }
    }
  }
}
