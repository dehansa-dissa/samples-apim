openapi: 3.0.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /ai/api-chat/prepare:
    post:
      summary: Prepare
      operationId: prepare_ai_api_chat_prepare_post
      parameters:
        - required: false
          schema:
            type: string
            title: Apitype
          name: apiType
          in: query
        - required: false
          schema:
            type: string
            title: Apichatrequestid
          name: apiChatRequestId
          in: header
        - required: false
          schema:
            type: string
            title: Api-Key
          name: API-KEY
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Req
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/api-chat/execute:
    post:
      summary: Execute
      operationId: execute_ai_api_chat_execute_post
      parameters:
        - required: false
          schema:
            type: string
            title: Apitype
          name: apiType
          in: query
        - required: false
          schema:
            type: string
            title: Apichatrequestid
          name: apiChatRequestId
          in: header
        - required: false
          schema:
            type: string
            title: Api-Key
          name: API-KEY
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Req
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/marketplace-assistant/chat:
    post:
      summary: Chat
      operationId: chat_ai_marketplace_assistant_chat_post
      parameters:
        - required: false
          schema:
            type: string
            title: Api-Key
          name: API-KEY
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Req
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/spec-populator/publish-api:
    post:
      summary: Publish Api
      operationId: publish_api_ai_spec_populator_publish_api_post
      parameters:
        - required: false
          schema:
            type: string
            title: Api-Key
          name: API-KEY
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Req
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/spec-populator/remove-api/{uuid}:
    delete:
      summary: Remove Api
      operationId: remove_api_ai_spec_populator_remove_api__uuid__delete
      parameters:
        - required: true
          schema:
            type: string
            title: Uuid
          name: uuid
          in: path
        - required: false
          schema:
            type: string
            title: Api-Key
          name: API-KEY
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/spec-populator/api-count:
    get:
      summary: Api Count
      operationId: api_count_ai_spec_populator_api_count_get
      parameters:
        - required: false
          schema:
            type: string
            title: Api-Key
          name: API-KEY
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/spec-populator/bulk-upload:
    post:
      summary: Upload Bulk Apis
      operationId: upload_bulk_apis_ai_spec_populator_bulk_upload_post
      parameters:
        - required: false
          schema:
            type: string
            title: Api-Key
          name: API-KEY
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Req
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/spec-populator/bulk-remove:
    delete:
      summary: Remove Bulk Apis
      operationId: remove_bulk_apis_ai_spec_populator_bulk_remove_delete
      parameters:
        - name: API-KEY
          in: header
          required: false
          schema:
            type: string
            title: Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/spec-populator/bulk-remove-all-tenant:
    delete:
      summary: Remove Bulk APIs for All Tenants
      operationId: remove_bulk_apis_all_tenants
      parameters:
        - name: x-jwt-assertion
          in: header
          required: true
          schema:
            type: string
            description: JWT assertion for authentication
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Unauthorized - JWT validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/api-design-assistant/chat:
    post:
      summary: Generate API specifications based on user input
      description: Generates API specifications based on user input and tracks session state.
      operationId: designAssistantChat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Natural language description of the API to be created
                  example: "create an API for a banking transaction."
                sessionId:
                  type: string
                  description: Unique identifier for the user session
                  example: "1234567890"
      responses:
        "200":
          description: Successful response with API specification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backendResponse:
                    type: string
                    description: List of suggestions for API improvements
                  isSuggestions:
                    type: boolean
                    description: Indicates if there are suggestions available
                  typeOfApi:
                    type: string
                    description: Detected type of API to be created
                  code:
                    type: string
                    description: Generated API specification
                  paths:
                    type: array
                    description: API endpoint paths and operations
                    items:
                      type: string
                  apiTypeSuggestion:
                    type: string
                    description: Suggested API type based on user input
                  missingValues:
                    type: string
                    description: Prompts for any required missing information
                  state:
                    type: string
                    description: Current state of the API generation process
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request. The 'text' field is missing or incorrectly named."
        "415":
          description: Unsupported Media Type (Invalid JSON format)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Request body must be in JSON format."
  /ai/api-design-assistant/generate-api-payload:
    post:
      summary: Generate API Payload
      description: Generate an API payload using the stored specification.
      operationId: designAssistantApiPayloadGen
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  description: Session ID to retrieve the generated API specification
                  example: "1234567890"
      responses:
        "200":
          description: API payload successfully created.
          content:
            application/json:
              schema:
                type: string
                description: Generated payload for API
        "400":
          description: Invalid request or session ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
  /ai/api-design-assistant/regenerate-spec:
    post:
      summary: Regenerate API specification based on user input and session
      description: Regenerates the API specification using the provided text and session ID. Requires JWT authentication.
      operationId: designAssistantRegenerateSpec
      parameters:
        - name: x-jwt-assertion
          in: header
          required: true
          schema:
            type: string
            description: JWT assertion for authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Natural language description for regenerating the API spec
                  example: "update the API to include a transaction endpoint"
                sessionId:
                  type: string
                  description: Unique identifier for the user session
                  example: "1234567890"
      responses:
        "201":
          description: Successfully regenerated API specification.
          content:
            application/json:
              schema:
                type: object
                description: The regenerated API specification and related metadata
        "401":
          description: Unauthorized - JWT validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/api-mock/generate-mock-scripts:
    post:
      summary: Generate Mock Scripts Endpoint
      operationId: generate_mock_scripts_endpoint_generate_mocks_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - swagger
              properties:
                swagger:
                  type: string
                  example: '{ "openapi": "3.0.0", "info": { "title": "Petstore", "version": "1.0.0" }, "paths": { "/pets": { "get": { "summary": "List all pets", "responses": { "200": { "description": "A list of pets." } } } } } }'
                config:
                  anyOf:
                    - type: object
                      properties:
                        instructions:
                          anyOf:
                            - type: string
                          example: Generate mocks for listing all pets
                        usePreviousScripts:
                          type: boolean
                          default: false
                          example: false
            example:
              swagger: '{ "openapi": "3.0.0", "info": { "title": "Petstore", "version":
                "1.0.0" }, "paths": { "/pets": { "get": { "summary": "List all pets",
                "responses": { "200": { "description": "A list of pets." } } } } }
                }'
              config:
                instructions: Generate mocks for listing all pets
                usePreviousScripts: false
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                title: HTTPValidationError
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      required:
                        - loc
                        - msg
                        - type
                      properties:
                        loc:
                          type: array
                          items:
                            anyOf:
                              - type: string
                              - type: integer
                          example:
                            - body
                            - swagger
                        msg:
                          type: string
                          example: field required
                        type:
                          type: string
                          example: value_error.missing
  /ai/api-mock/modify-resource-script:
    post:
      summary: Modify Method Endpoint
      operationId: modify_method_endpoint_modify_method_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - swagger
                - config
              properties:
                swagger:
                  type: string
                  example: '{ "openapi": "3.0.0", "info": { "title": "Petstore", "version": "1.0.0" }, "paths": { "/pets": { "get": { "summary": "List all pets", "responses": { "200": { "description": "A list of pets." } } } } } }'
                config:
                  type: object
                  required:
                    - modify
                  properties:
                    instructions:
                      type: string
                      default: Generate mock scripts for the specified endpoint
                      example: change the name Doggo to Sky
                    script:
                      type: string
                      default: No Script
                      example: 'mc.setProperty(''CONTENT_TYPE'', ''application/json''); var response = [{ id: 1, name: ''Doggo'' }]; mc.setPayloadJSON(response); mc.setProperty(''HTTP_SC'', ''200'');'
                    modify:
                      type: object
                      required:
                        - path
                        - method
                      properties:
                        path:
                          type: string
                          example: "/pets"
                        method:
                          type: string
                          example: get
                        isDefaultScript:
                          type: boolean
                          default: false
                          example: false
            example:
              swagger: '{ "openapi": "3.0.0", "info": { "title": "Petstore", "version":
                "1.0.0" }, "paths": { "/pets": { "get": { "summary": "List all pets",
                "responses": { "200": { "description": "A list of pets." } } } } }
                }'
              config:
                instructions: change the name Doggo to Sky
                script: 'mc.setProperty(''CONTENT_TYPE'', ''application/json''); var response = [{ id: 1, name: ''Doggo'' }]; mc.setPayloadJSON(response); mc.setProperty(''HTTP_SC'', ''200'');'
                modify:
                  path: "/pets"
                  method: get
                  isDefaultScript: false
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                title: HTTPValidationError
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      required:
                        - loc
                        - msg
                        - type
                      properties:
                        loc:
                          type: array
                          items:
                            anyOf:
                              - type: string
                              - type: integer
                          example:
                            - body
                            - swagger
                        msg:
                          type: string
                          example: field required
                        type:
                          type: string
                          example: value_error.missing
  /ai/sdk-generation/merge-openapi-specs:
    post:
      summary: Merge multiple OpenAPI specifications
      description: Merges multiple OpenAPI specifications and returns the combined result.
      operationId: mergeOpenApiSpecs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - specifications
                - contexts
              properties:
                specifications:
                  type: object
                  description: A JSON object containing OpenAPI specifications.
                apiContexts:
                  type: object
                  description: A JSON object mapping API names to their context paths.
      responses:
        '201':
          description: Successfully merged OpenAPI specifications
          content:
            application/json:
              schema:
                type: object
                description: The merged OpenAPI specification
        '400':
          description: Bad request (missing or malformed payload)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /ai/sdk-generation/generate-application-code:
    post:
      summary: Generate application code using OpenAPI spec and use case
      description: Uses an OpenAPI spec, selected methods, and a use case to generate application code.
      operationId: generateApplicationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - APISpecification
                - sdkMethodsFile
                - useCase
                - language
              properties:
                APISpecification:
                  type: object
                  description: The API specification to generate code from.
                sdkMethodsFile:
                  type: object
                  description: File containing SDK methods.
                useCase:
                  type: string
                  description: Use case description guiding the code generation.
                language:
                  type: string
                  enum: [java, javascript]
                  description: Target programming language.
      responses:
        '201':
          description: Successfully generated application code
          content:
            text/plain:
              schema:
                type: string
                description: The generated application code as plain text
        '500':
          description: Internal server error during code generation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
