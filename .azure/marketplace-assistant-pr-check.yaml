resources:
  repositories:
    - repository: common-templates
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      endpoint: wso2-enterprise

trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - marketplace-assistant-api/*
      - .azure/marketplace-assistant-pr-check.yaml

pool:
  vmImage: 'ubuntu-20.04'

variables:
  - name: CONTAINER_REGISTRY
    value: 'choreocontrolplane.azurecr.io'
  - name: REPOSITORY
    value: 'choreoipaas/marketplace-assistant'

steps:
  - task: Docker@2
    displayName: 'Login to ACR'
    inputs:
      command: login
      containerRegistry: 'wso2choreo-control-plane-acr'

  - task: Docker@2
    displayName: 'Build Service Docker image'
    inputs:
      command: build
      containerRegistry: 'wso2choreo-control-plane-acr'
      repository: $(REPOSITORY)
      Dockerfile: 'marketplace-assistant-api/Dockerfile'
      buildContext: 'marketplace-assistant-api'
      tags: |
        latest
  - template: install/install-trivy.yaml@common-templates
  - template: pr/trivy-scan.yaml@common-templates
    parameters:
      IMAGES:
        - $(CONTAINER_REGISTRY)/$(REPOSITORY):latest
      TRIVY_IGNORE_PATH: "marketplace-assistant-api/.trivyignore"
