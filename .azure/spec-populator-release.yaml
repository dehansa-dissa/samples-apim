resources:
  repositories:
    - repository: common-templates
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      endpoint: wso2-enterprise

trigger:
  batch: true
  branches:
    include:
      - refs/tags/v*
  paths:
    include:
      - spec_populator_service/*

pr: none

jobs:
  - job: build
    displayName: Build/DockerPush

    variables:
      - name: CONTAINER_REGISTRY
        value: choreocontrolplane.azurecr.io
      - name: REPOSITORY
        value: choreoipaas/spec-populator
      - name: DOCKER_BUILDKIT
        value: 1
      - name: TAG
        value: $(Build.SourceBranchName)

    steps:
      - task: Docker@2
        displayName: "Docker Build"
        inputs:
          command: build
          containerRegistry: "wso2choreo-control-plane-acr"
          repository: $(REPOSITORY)
          Dockerfile: 'spec_populator_service/Dockerfile'
          buildContext: 'spec_populator_service'
          tags: |
            $(TAG)
      - template: install/install-trivy.yaml@common-templates
      - template: pr/trivy-scan.yaml@common-templates
        parameters:
          IMAGES:
            - $(CONTAINER_REGISTRY)/$(REPOSITORY):$(TAG)
          TRIVY_IGNORE_PATH: "spec_populator_service/.trivyignore"
      - task: Docker@2
        displayName: "Docker Push"
        inputs:
          command: push
          containerRegistry: "wso2choreo-control-plane-acr"
          repository: $(REPOSITORY)
          tags: |
            $(TAG)
