resources:
  repositories:
    - repository: common-templates
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      endpoint: wso2-enterprise

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - marketplace-assistant-api/*
      - .azure/marketplace-assistant-build.yaml

pr: none

jobs:
  - job: build
    displayName: Build/DockerPush
    pool:
      vmImage: "ubuntu-20.04"

    variables:
      - name: CONTAINER_REGISTRY
        value: choreocontrolplane.azurecr.io
      - name: REPOSITORY
        value: choreoipaas/marketplace-assistant
      - name: DOCKER_BUILDKIT
        value: 1
      - name: APP_REVISION
        value: $(Build.SourceBranchName)-$(Build.SourceVersion)
      - name: PDP_CONTAINER_REGISTRY
        value: choreoprivateacr.azurecr.io

    steps:
      - task: Docker@2
        displayName: "Docker Build"
        inputs:
          command: build
          containerRegistry: "wso2choreo-control-plane-acr"
          repository: $(REPOSITORY)
          Dockerfile: 'marketplace-assistant-api/Dockerfile'
          buildContext: 'marketplace-assistant-api'
          tags: |
            $(APP_REVISION)
            latest
      - script: |
          docker tag $(CONTAINER_REGISTRY)/$(REPOSITORY):$(APP_REVISION) $(PDP_CONTAINER_REGISTRY)/$(REPOSITORY):$(APP_REVISION)
          docker tag $(CONTAINER_REGISTRY)/$(REPOSITORY):latest $(PDP_CONTAINER_REGISTRY)/$(REPOSITORY):latest
        displayName: "Docker vtag for pdp registry"
      - template: install/install-trivy.yaml@common-templates
      - template: pr/trivy-scan.yaml@common-templates
        parameters:
          IMAGES:
            - $(CONTAINER_REGISTRY)/$(REPOSITORY):$(APP_REVISION)
          TRIVY_IGNORE_PATH: "marketplace-assistant-api/.trivyignore"

      - task: Docker@2
        displayName: "Docker Push"
        inputs:
          command: push
          containerRegistry: "wso2choreo-control-plane-acr"
          repository: $(REPOSITORY)
          tags: |
            $(APP_REVISION)
            latest

      - task: Docker@2
        displayName: "Docker Push to pdp registry"
        inputs:
          command: push
          containerRegistry: "choreo-private-acr"
          repository: $(REPOSITORY)
          tags: |
            $(APP_REVISION)
            latest

      - template: update-image-in-cp-overlays.yml@common-templates
        parameters:
          CLUSTER_IMAGE_MAP:
            commonnamespacesdp:
              - $(CONTAINER_REGISTRY)/$(REPOSITORY):$(APP_REVISION)
            commonnamespacescombineddp:
              - $(CONTAINER_REGISTRY)/$(REPOSITORY):$(APP_REVISION)
            privatedataplane:
              - $(PDP_CONTAINER_REGISTRY)/$(REPOSITORY):$(APP_REVISION)
