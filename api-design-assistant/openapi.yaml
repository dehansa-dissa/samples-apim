openapi: 3.0.0
info:
  title: API Design Assistant
  description: Service for creating API specifications based on natural language descriptions
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
    description: Local development server
paths:
  /chat:
    post:
      summary: Generate API specifications based on user input
      description: Generates API specifications based on user input and tracks session state.
      operationId: designAssistantChat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Natural language description of the API to be created
                  example: "create an API for a banking transaction."
                sessionId:
                  type: string
                  description: Unique identifier for the user session
                  example: "1234567890"
      responses:
        "200":
          description: Successful response with API specification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backendResponse:
                    type: string
                    description: List of suggestions for API improvements
                  isSuggestions:
                    type: boolean
                    description: Indicates if there are suggestions available
                  typeOfApi:
                    type: string
                    description: Detected type of API to be created
                  code:
                    type: string
                    description: Generated API specification
                  paths:
                    type: array
                    description: API endpoint paths and operations
                    items:
                      type: string
                  apiTypeSuggestion:
                    type: string
                    description: Suggested API type based on user input
                  missingValues:
                    type: string
                    description: Prompts for any required missing information
                  state:
                    type: string
                    description: Current state of the API generation process
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request. The 'text' field is missing or incorrectly named."
        "415":
          description: Unsupported Media Type (Invalid JSON format)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Request body must be in JSON format."
  /generate-api-payload:
    post:
      summary: Generate API Payload
      description: Generate an API payload using the stored specification.
      operationId: designAssistantApiPayloadGen
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  description: Session ID to retrieve the generated API specification
                  example: "1234567890"
      responses:
        "200":
          description: API payload successfully created.
          content:
            application/json:
              schema:
                type: string
                description: Generated payload for API
        "400":
          description: Invalid request or session ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
    /regenerate-spec:
      post:
        summary: Regenerate API Specification
        description: Regenerates the API specification based on updated user input and session state.
        operationId: designAssistantRegenerateSpec
        requestBody:
          required: true # have to check
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                    description: Natural language description of the API to be created
                    example: "create an API for a banking transaction."
                  sessionId:
                    type: string
                    description: Unique identifier for the user session
                    example: "1234567890"
        responses:
          "200":
            description: Successfully regenerated API specification.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    regeneratedSpec:
                      type: string
                      description: The regenerated API specification
                    usage:
                      type: object
                      properties:
                        prompt_tokens:
                          type: integer
                          description: Number of tokens used in the prompt
                        completion_tokens:
                          type: integer
                          description: Number of tokens used in the completion
                        total_tokens:
                          type: integer
                          description: Total number of tokens used
          "400":
            description: Invalid request or session ID
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: string
                      description: Error message
