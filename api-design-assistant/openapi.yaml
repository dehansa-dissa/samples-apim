openapi: 3.0.0
info:
  title: API Design Assistant
  description: Service for creating API specifications based on natural language descriptions
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
    description: Local development server
paths:
  /api-design:
    post:
      summary: Generate API specifications based on user input
      description: Generates API specifications based on user input and tracks session state.
      operationId: generateApiSpec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
                - session_id
              properties:
                text:
                  type: string
		  description: Natural language description of the API to be created
                  example: "create an API for a banking transaction."
                session_id:
                  type: string
		  description: Unique identifier for the user session
                  example: "1234567890"
      responses:
        "200":
          description: Successful response with API specification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backendResponse:
                    type: array
		    description: List of suggestions for API improvements
                    items:
                      type: string
                  isSuggestions:
                    type: Boolean
		    description: Indicates if there are suggestions available
                  typeOfApi:
                    type: string
		    description: Detected type of API to be created
                  code:
                    type: string
		    description: Generated API specification
                  paths:
                    type: object
                    description: API endpoint paths and operations
                  apiTypeSuggestion:
                    type: string
                    description: Suggested API type based on user input
                  missingValues:
                    type: string
                    description: Prompts for any required missing information
                  state:
                    type: string
		    description: Current state of the API generation process
                    enum: [START, IN_PROGRESS, COMPLETE]
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
		    example: "Invalid request. The 'text' field is missing or incorrectly named."
        "415":
          description: Unsupported Media Type (Invalid JSON format)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Request body must be in JSON format."
  /create-api:
    post:
      summary: Create API Payload
      description: Creates an API payload using the stored specification.
      operationId: createApiInPortal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
              properties:
                session_id:
                  type: string
                  description: Session ID to retrieve the generated API specification
                  example: "1234567890"
      responses:
        "200":
          description: API payload successfully created.
          content:
            application/json:
              schema:
                type: object
                description: Generated payload for API
        "400":
          description: Invalid request or session ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message